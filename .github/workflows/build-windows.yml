name: build-windows

# Builds the Windows product when a release is published:
#   * runs the full test suite (GUI tests run offscreen)
#   * builds Argus.exe (GUI) and ArgusService.exe (service host)
#     with PyInstaller
#   * builds ArgusSetup.exe with Inno Setup
#   * attaches the installer and both portable exes to the release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening,
      # v1.0.4): a moved tag must never change what a release build
      # runs. SHAs verified against the upstream repos with
      # `git ls-remote` on 2026-10-19.
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r packaging/requirements-ci.txt
          pip install --no-deps ".[gui,windows]"

      - name: Run the test suite (GUI offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build Argus.exe (GUI)
        run: pyinstaller packaging/Argus.spec --noconfirm

      - name: Build ArgusService.exe (service host)
        run: pyinstaller packaging/ArgusService.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build the installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\argus.iss'

      - name: Assemble the portable edition
        run: |
          New-Item -ItemType Directory -Force dist\ArgusPortable | Out-Null
          Copy-Item dist\Argus.exe dist\ArgusPortable\
          Copy-Item dist\ArgusService.exe dist\ArgusPortable\
          Copy-Item packaging\portable\Argus-Portable.bat dist\ArgusPortable\
          Copy-Item packaging\portable\README-PORTABLE.txt dist\ArgusPortable\
          Compress-Archive -Path dist\ArgusPortable\* -DestinationPath dist\ArgusPortable.zip -Force

      - name: Generate SHA256SUMS.txt for the release assets
        run: |
          $assets = "dist/ArgusSetup.exe", "dist/ArgusPortable.zip", "dist/Argus.exe", "dist/ArgusService.exe"
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $asset -Leaf)"
          }
          $lines | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Attach the installer, portable edition, exes and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} dist/ArgusSetup.exe dist/ArgusPortable.zip dist/Argus.exe dist/ArgusService.exe dist/SHA256SUMS.txt --clobber
